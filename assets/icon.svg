<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#404040"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="lensBarrelGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="38%" cy="33%" r="65%">
      <stop offset="0%" stop-color="#1a1a2a"/>
      <stop offset="50%" stop-color="#080810"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <clipPath id="bladeClip">
      <circle cx="0" cy="0" r="170"/>
    </clipPath>
  </defs>

  <!-- App background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGrad)"/>

  <!-- Camera body -->
  <rect x="112" y="300" width="800" height="500" rx="60" fill="url(#bodyGrad)" filter="url(#bodyShadow)"/>
  <rect x="112" y="300" width="800" height="6" rx="3" fill="#ffffff" opacity="0.08"/>

  <!-- Viewfinder hump -->
  <rect x="360" y="230" width="160" height="90" rx="24" fill="url(#bodyGrad)"/>

  <!-- Shutter button -->
  <circle cx="730" cy="260" r="32" fill="#252525"/>
  <circle cx="730" cy="256" r="22" fill="#c8c8c8"/>
  <circle cx="724" cy="250" r="7" fill="#ffffff" opacity="0.5"/>

  <!-- Top detail strip -->
  <rect x="150" y="336" width="100" height="12" rx="6" fill="#404040"/>

  <!-- Indicator light -->
  <circle cx="190" cy="378" r="12" fill="#d0d0d0" opacity="0.9"/>
  <circle cx="187" cy="375" r="4" fill="#ffffff" opacity="0.6"/>

  <!-- Lens barrel outer ring (shadow) -->
  <circle cx="514" cy="572" r="192" fill="#000000" opacity="0.5"/>

  <!-- Lens barrel rings -->
  <circle cx="512" cy="570" r="188" fill="url(#lensBarrelGrad)"/>
  <circle cx="512" cy="570" r="188" fill="none" stroke="#d0d0d0" stroke-width="6" opacity="0.65"/>
  <circle cx="512" cy="570" r="180" fill="none" stroke="#505050" stroke-width="3" opacity="0.5"/>
  <circle cx="512" cy="570" r="174" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
  <circle cx="512" cy="570" r="168" fill="#0d0d0d"/>

  <!-- Aperture blades inside lens -->
  <g transform="translate(512,570)">
    <g clip-path="url(#bladeClip)">
      <path d="M 130,-109 A 170,170 0 0,1 130,109 L 24,64 A 68,68 0 0,0 67,-12 Z"
            fill="url(#bladeGrad)" stroke="#b0b0b0" stroke-width="1" opacity="0.95"/>
      <path d="M 130,-109 A 170,170 0 0,1 130,109 L 24,64 A 68,68 0 0,0 67,-12 Z"
            fill="url(#bladeGrad)" stroke="#b0b0b0" stroke-width="1" opacity="0.95"
            transform="rotate(60)"/>
      <path d="M 130,-109 A 170,170 0 0,1 130,109 L 24,64 A 68,68 0 0,0 67,-12 Z"
            fill="url(#bladeGrad)" stroke="#b0b0b0" stroke-width="1" opacity="0.95"
            transform="rotate(120)"/>
      <path d="M 130,-109 A 170,170 0 0,1 130,109 L 24,64 A 68,68 0 0,0 67,-12 Z"
            fill="url(#bladeGrad)" stroke="#b0b0b0" stroke-width="1" opacity="0.95"
            transform="rotate(180)"/>
      <path d="M 130,-109 A 170,170 0 0,1 130,109 L 24,64 A 68,68 0 0,0 67,-12 Z"
            fill="url(#bladeGrad)" stroke="#b0b0b0" stroke-width="1" opacity="0.95"
            transform="rotate(240)"/>
      <path d="M 130,-109 A 170,170 0 0,1 130,109 L 24,64 A 68,68 0 0,0 67,-12 Z"
            fill="url(#bladeGrad)" stroke="#b0b0b0" stroke-width="1" opacity="0.95"
            transform="rotate(300)"/>
    </g>

    <!-- Center lens opening -->
    <circle r="66" fill="url(#centerGrad)"/>
    <circle r="66" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.08"/>
    <circle r="33" fill="#010204"/>

    <!-- Curved shadow on lower outer ring for depth -->
    <circle r="182" fill="none" stroke="#000000" stroke-width="18" opacity="0.25"
            stroke-dasharray="220 528" stroke-dashoffset="-154"/>
    <circle r="182" fill="none" stroke="#000000" stroke-width="10" opacity="0.15"
            stroke-dasharray="260 528" stroke-dashoffset="-134"/>

    <!-- Reflection -->
    <ellipse cx="-19" cy="-20" rx="20" ry="11" fill="#ffffff" opacity="0.10" transform="rotate(-35,-19,-20)"/>
    <ellipse cx="-25" cy="-26" rx="7" ry="4" fill="#ffffff" opacity="0.30" transform="rotate(-35,-25,-26)"/>
    <ellipse cx="-29" cy="-30" rx="3" ry="2" fill="#ffffff" opacity="0.80" transform="rotate(-35,-29,-30)"/>
  </g>
</svg>
